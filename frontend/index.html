<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Learning Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#f5f0e8; --surface:#fffdf7; --border:#d8d0c0;
      --ink:#1a1710; --muted:#7a7060; --accent:#2d5a3d; --accent2:#8b3a1a;
      --danger:#b33a2a; --radius:10px;
      --font-s:'Fraunces',serif; --font-m:'IBM Plex Mono',monospace;
      --shadow:0 2px 12px rgba(0,0,0,.08);
    }
    body { background:var(--bg); color:var(--ink); font-family:var(--font-s); min-height:100vh; display:flex; flex-direction:column; }
    nav { display:flex; align-items:center; gap:1rem; padding:.9rem 2rem; background:var(--surface); border-bottom:1px solid var(--border); }
    .nav-brand { font-size:1.25rem; font-weight:600; color:var(--accent); margin-right:auto; letter-spacing:-.02em; }
    .nav-brand span { color:var(--accent2); font-style:italic; }
    nav button { background:none; border:1px solid var(--border); padding:.35rem .85rem; border-radius:var(--radius); font-family:var(--font-m); font-size:.78rem; color:var(--ink); cursor:pointer; transition:background .15s,color .15s; }
    nav button:hover { background:var(--ink); color:var(--bg); }
    #lang-select { font-family:var(--font-m); font-size:.78rem; border:1px solid var(--border); border-radius:var(--radius); padding:.35rem .6rem; background:var(--surface); color:var(--ink); cursor:pointer; }
    .nav-user { font-family:var(--font-m); font-size:.78rem; color:var(--muted); }
    .view { display:none; flex:1; flex-direction:column; align-items:center; padding:3rem 1.5rem; }
    .view.active { display:flex; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:2.5rem 2rem; width:100%; max-width:420px; }
    .card h2 { font-size:1.6rem; margin-bottom:1.5rem; font-weight:600; }
    .form-group { margin-bottom:1.1rem; }
    .form-group label { display:block; font-family:var(--font-m); font-size:.75rem; color:var(--muted); margin-bottom:.35rem; }
    .form-group input, .form-group textarea { width:100%; padding:.65rem .9rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--ink); font-family:var(--font-s); font-size:1rem; outline:none; transition:border-color .15s; }
    .form-group input:focus, .form-group textarea:focus { border-color:var(--accent); }
    .form-group textarea { resize:vertical; min-height:110px; }
    .field-error { font-family:var(--font-m); font-size:.72rem; color:var(--danger); margin-top:.25rem; display:none; }
    .field-error.visible { display:block; }
    .btn-primary { width:100%; padding:.7rem; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-family:var(--font-s); font-size:1rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
    .btn-primary:hover { opacity:.88; }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-google { width:100%; padding:.65rem; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:var(--radius); font-family:var(--font-m); font-size:.85rem; cursor:pointer; transition:background .15s; display:flex; align-items:center; justify-content:center; gap:.5rem; }
    .btn-google:hover { background:var(--bg); }
    .divider { display:flex; align-items:center; gap:.75rem; margin:1rem 0; color:var(--muted); font-family:var(--font-m); font-size:.75rem; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .auth-switch { text-align:center; margin-top:1.2rem; font-family:var(--font-m); font-size:.78rem; color:var(--muted); }
    .auth-switch a { color:var(--accent); cursor:pointer; }
    .server-error { background:#fff0ee; border:1px solid #f5c0b8; border-radius:var(--radius); padding:.6rem .9rem; font-family:var(--font-m); font-size:.78rem; color:var(--danger); margin-bottom:1rem; display:none; }
    .server-error.visible { display:block; }
    #view-journal { max-width:860px; width:100%; margin:0 auto; }
    .journal-header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:.5rem; }
    .journal-header h2 { font-size:1.6rem; font-weight:300; font-style:italic; }
    .new-session-form { display:flex; gap:.75rem; margin-bottom:2rem; }
    .new-session-form input { flex:1; padding:.65rem .9rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--ink); font-family:var(--font-s); font-size:1rem; outline:none; transition:border-color .15s; }
    .new-session-form input:focus { border-color:var(--accent); }
    .new-session-form button { padding:.65rem 1.25rem; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-family:var(--font-s); font-size:1rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
    .new-session-form button:hover { opacity:.88; }
    .session-list { display:flex; flex-direction:column; gap:.75rem; }
    .session-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:box-shadow .15s,border-color .15s; }
    .session-card:hover { box-shadow:var(--shadow); border-color:var(--accent); }
    .session-topic { font-size:1.05rem; font-weight:600; }
    .session-date { font-family:var(--font-m); font-size:.72rem; color:var(--muted); margin-top:2px; }
    .session-card-actions { display:flex; gap:.5rem; }
    .btn-danger { padding:.3rem .7rem; border:1px solid var(--danger); border-radius:var(--radius); background:none; color:var(--danger); font-family:var(--font-m); font-size:.72rem; cursor:pointer; transition:background .15s,color .15s; }
    .btn-danger:hover { background:var(--danger); color:#fff; }
    .empty-state { text-align:center; padding:3rem 1rem; color:var(--muted); font-style:italic; font-size:1.1rem; }
    #view-chat { max-width:860px; width:100%; margin:0 auto; padding-bottom:0; }
    .chat-header { display:flex; align-items:center; gap:1rem; margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border); }
    .chat-header h3 { font-size:1.2rem; font-weight:600; font-style:italic; }
    .btn-back { background:none; border:none; color:var(--accent); font-family:var(--font-m); font-size:.8rem; cursor:pointer; padding:0; }
    .btn-back:hover { text-decoration:underline; }
    #chat-messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:.85rem; padding-bottom:1rem; max-height:calc(100vh - 340px); min-height:200px; }
    .message { display:flex; flex-direction:column; gap:3px; animation:fadeUp .2s ease both; }
    .message.user { align-items:flex-end; }
    .message.assistant { align-items:flex-start; }
    .msg-label { font-family:var(--font-m); font-size:.68rem; color:var(--muted); padding:0 3px; }
    .bubble { max-width:78%; padding:.7rem 1rem; border-radius:var(--radius); line-height:1.65; white-space:pre-wrap; word-break:break-word; font-size:.95rem; }
    .user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:3px; }
    .assistant .bubble { background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:3px; }
    .typing .bubble { display:flex; gap:5px; align-items:center; padding:.85rem 1rem; }
    .typing .bubble span { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:bounce .9s ease-in-out infinite; }
    .typing .bubble span:nth-child(2){animation-delay:.15s} .typing .bubble span:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .chat-input-row { display:flex; gap:.75rem; padding:1rem 0 1.5rem; border-top:1px solid var(--border); margin-top:.5rem; }
    #chat-input { flex:1; padding:.65rem .9rem; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--ink); font-family:var(--font-s); font-size:1rem; outline:none; resize:none; min-height:44px; max-height:140px; line-height:1.5; transition:border-color .15s; }
    #chat-input:focus { border-color:var(--accent); }
    #chat-send { padding:.65rem 1.25rem; background:var(--accent); color:#fff; border:none; border-radius:var(--radius); font-family:var(--font-s); font-size:1rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
    #chat-send:hover{opacity:.88} #chat-send:disabled{opacity:.45;cursor:not-allowed}
    #view-contact { max-width:520px; width:100%; }
    #view-contact h2 { font-size:1.6rem; font-weight:600; margin-bottom:1.5rem; }
    .success-banner { background:#edf7ee; border:1px solid #a8d9ac; border-radius:var(--radius); padding:.75rem 1rem; font-family:var(--font-m); font-size:.82rem; color:#2d5a3d; display:none; margin-bottom:1rem; }
    .success-banner.visible{display:block}
    #chat-messages::-webkit-scrollbar{width:4px} #chat-messages::-webkit-scrollbar-track{background:transparent} #chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">AI <span>Journal</span></div>
  <span class="nav-user" id="nav-user-name" style="display:none"></span>
  <button id="nav-journal-btn" data-i18n="nav_journal" style="display:none">My Journal</button>
  <button id="nav-contact-btn" data-i18n="nav_contact">Contact</button>
  <button id="nav-logout-btn" data-i18n="nav_logout" style="display:none">Log out</button>
  <button id="nav-login-btn" data-i18n="nav_login">Log in</button>
  <select id="lang-select">
    <option value="en_GB">English (UK)</option>
    <option value="de_DE">Deutsch</option>
    <option value="es_AR">Español (AR)</option>
  </select>
</nav>

<!-- AUTH -->
<div class="view active" id="view-auth">
  <div class="card">
    <h2 id="auth-title" data-i18n="auth_welcome">Welcome back</h2>
    <div class="server-error" id="auth-error"></div>
    <div id="login-form">
      <div class="form-group">
        <label data-i18n="auth_email">Email address</label>
        <input type="email" id="login-email" autocomplete="email"/>
        <div class="field-error" id="err-login-email"></div>
      </div>
      <div class="form-group">
        <label data-i18n="auth_password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password"/>
        <div class="field-error" id="err-login-password"></div>
      </div>
      <button class="btn-primary" id="login-btn" data-i18n="auth_login_btn">Log in</button>
      <div class="divider"><span data-i18n="auth_or">or</span></div>
      <button class="btn-google" id="google-login-btn">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.16C6.51 42.68 14.62 48 24 48z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.16C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.32 2.56 13.22l7.98 6.16C12.43 13.72 17.74 9.5 24 9.5z"/></svg>
        <span data-i18n="auth_google_btn">Continue with Google</span>
      </button>
      <div class="auth-switch"><a id="switch-to-register" data-i18n="auth_switch_register">No account yet? Create one</a></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label data-i18n="auth_name">Full name</label>
        <input type="text" id="reg-name" autocomplete="name"/>
        <div class="field-error" id="err-reg-name"></div>
      </div>
      <div class="form-group">
        <label data-i18n="auth_email">Email address</label>
        <input type="email" id="reg-email" autocomplete="email"/>
        <div class="field-error" id="err-reg-email"></div>
      </div>
      <div class="form-group">
        <label data-i18n="auth_password">Password</label>
        <input type="password" id="reg-password" autocomplete="new-password"/>
        <div class="field-error" id="err-reg-password"></div>
      </div>
      <button class="btn-primary" id="register-btn" data-i18n="auth_register_btn">Create account</button>
      <div class="auth-switch"><a id="switch-to-login" data-i18n="auth_switch_login">Already have an account? Log in</a></div>
    </div>
  </div>
</div>

<!-- JOURNAL -->
<div class="view" id="view-journal">
  <div style="width:100%">
    <div class="journal-header">
      <h2 id="journal-greeting" data-i18n="journal_greeting">Hello</h2>
    </div>
    <div class="new-session-form">
      <input type="text" id="new-topic-input" data-i18n-placeholder="journal_topic_placeholder" placeholder="What do you want to learn today?"/>
      <button id="new-session-btn" data-i18n="journal_start_btn">Start</button>
    </div>
    <div class="session-list" id="session-list"></div>
  </div>
</div>

<!-- CHAT -->
<div class="view" id="view-chat">
  <div style="width:100%;display:flex;flex-direction:column;flex:1">
    <div class="chat-header">
      <button class="btn-back" id="back-btn" data-i18n="journal_back">← Back</button>
      <h3 id="chat-topic-title"></h3>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" rows="1" data-i18n-placeholder="journal_input_placeholder" placeholder="Ask something…"></textarea>
      <button id="chat-send" data-i18n="journal_send">Send</button>
    </div>
  </div>
</div>

<!-- CONTACT -->
<div class="view" id="view-contact">
  <h2 data-i18n="contact_title">Get in touch</h2>
  <div class="success-banner" id="contact-success" data-i18n="contact_success"></div>
  <div class="server-error" id="contact-error"></div>
  <div class="form-group">
    <label data-i18n="contact_name">Your name</label>
    <input type="text" id="contact-name"/>
    <div class="field-error" id="err-contact-name"></div>
  </div>
  <div class="form-group">
    <label data-i18n="contact_email">Your email</label>
    <input type="email" id="contact-email"/>
    <div class="field-error" id="err-contact-email"></div>
  </div>
  <div class="form-group">
    <label data-i18n="contact_message">Your message</label>
    <textarea id="contact-message"></textarea>
    <div class="field-error" id="err-contact-message"></div>
  </div>
  <button class="btn-primary" id="contact-send-btn" data-i18n="contact_send">Send message</button>
</div>

<script>
const API = 'http://localhost:8000/api';
let token = localStorage.getItem('jwt') || null;
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let currentSessionId = null;
let translations = {};
let currentLang = localStorage.getItem('lang') || 'en_GB';

// I18N
async function loadTranslations(lang) {
  try { const r = await fetch(`i18n/${lang}.json`); translations = await r.json(); } catch {}
  applyTranslations();
}
function t(key, vars={}) {
  let s = translations[key] || key;
  for (const [k,v] of Object.entries(vars)) s = s.replace(`{${k}}`, v);
  return s;
}
function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
  if (currentUser) document.getElementById('journal-greeting').textContent = t('journal_greeting', {name: currentUser.name.split(' ')[0]});
}
document.getElementById('lang-select').addEventListener('change', e => {
  currentLang = e.target.value; localStorage.setItem('lang', currentLang); loadTranslations(currentLang);
});

// ROUTING
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
}
function updateNav() {
  const li = !!token;
  document.getElementById('nav-login-btn').style.display   = li ? 'none' : '';
  document.getElementById('nav-logout-btn').style.display  = li ? '' : 'none';
  document.getElementById('nav-journal-btn').style.display = li ? '' : 'none';
  document.getElementById('nav-user-name').style.display   = li ? '' : 'none';
  if (li && currentUser) document.getElementById('nav-user-name').textContent = currentUser.name;
}

// API
async function apiFetch(path, options={}) {
  const headers = {'Content-Type':'application/json', ...(options.headers||{})};
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(API + path, {...options, headers});
  if (res.status === 401) { logout(); throw new Error('auth'); }
  return res;
}

// AUTH
function setSession(data) {
  token = data.access_token; currentUser = data.user;
  localStorage.setItem('jwt', token); localStorage.setItem('user', JSON.stringify(currentUser));
  updateNav();
}
function logout() {
  token = null; currentUser = null;
  localStorage.removeItem('jwt'); localStorage.removeItem('user');
  updateNav(); showView('auth');
}
function showErr(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.add('visible'); }
function showFieldError(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.add('visible'); }
function clearErrors(...ids) { ids.forEach(id => { const e=document.getElementById(id); if(e){e.textContent='';e.classList.remove('visible');} }); }

document.getElementById('switch-to-register').addEventListener('click', () => {
  document.getElementById('login-form').style.display='none';
  document.getElementById('register-form').style.display='';
  document.getElementById('auth-title').textContent=t('auth_create');
  clearErrors('auth-error','err-login-email','err-login-password');
});
document.getElementById('switch-to-login').addEventListener('click', () => {
  document.getElementById('register-form').style.display='none';
  document.getElementById('login-form').style.display='';
  document.getElementById('auth-title').textContent=t('auth_welcome');
  clearErrors('auth-error','err-reg-name','err-reg-email','err-reg-password');
});

document.getElementById('login-btn').addEventListener('click', async () => {
  clearErrors('auth-error','err-login-email','err-login-password');
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;
  let ok=true;
  if (!email||!/\S+@\S+\.\S+/.test(email)){showFieldError('err-login-email',t('contact_error_email'));ok=false;}
  if (!pass){showFieldError('err-login-password','Password required.');ok=false;}
  if (!ok) return;
  const btn=document.getElementById('login-btn'); btn.disabled=true;
  try {
    const res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:email,password:pass})});
    const data=await res.json();
    if (!res.ok){showErr('auth-error',data.detail||t('error_network'));return;}
    setSession(data); await loadSessions(); showView('journal'); applyTranslations();
  } catch {showErr('auth-error',t('error_network'));} finally {btn.disabled=false;}
});

document.getElementById('register-btn').addEventListener('click', async () => {
  clearErrors('auth-error','err-reg-name','err-reg-email','err-reg-password');
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const pass=document.getElementById('reg-password').value;
  let ok=true;
  if (!name){showFieldError('err-reg-name',t('contact_error_name'));ok=false;}
  if (!email||!/\S+@\S+\.\S+/.test(email)){showFieldError('err-reg-email',t('contact_error_email'));ok=false;}
  if (pass.length<6){showFieldError('err-reg-password','Minimum 6 characters.');ok=false;}
  if (!ok) return;
  const btn=document.getElementById('register-btn'); btn.disabled=true;
  try {
    const res=await apiFetch('/auth/register',{method:'POST',body:JSON.stringify({name,email,password:pass})});
    const data=await res.json();
    if (!res.ok){showErr('auth-error',data.detail||t('error_network'));return;}
    setSession(data); showView('journal'); applyTranslations();
  } catch {showErr('auth-error',t('error_network'));} finally {btn.disabled=false;}
});

document.getElementById('google-login-btn').addEventListener('click', () => { window.location.href=API+'/auth/google'; });
document.getElementById('nav-logout-btn').addEventListener('click', logout);
document.getElementById('nav-login-btn').addEventListener('click', () => showView('auth'));
document.getElementById('nav-journal-btn').addEventListener('click', () => { loadSessions(); showView('journal'); });
document.getElementById('nav-contact-btn').addEventListener('click', () => showView('contact'));

// SESSIONS
async function loadSessions() {
  try { const r=await apiFetch('/sessions/'); renderSessions(await r.json()); } catch {}
}
function renderSessions(sessions) {
  const list=document.getElementById('session-list');
  if (!sessions.length){list.innerHTML=`<div class="empty-state">${t('journal_no_sessions')}</div>`;return;}
  list.innerHTML=sessions.map(s=>`
    <div class="session-card" data-id="${s.id}">
      <div>
        <div class="session-topic">${esc(s.topic)}</div>
        <div class="session-date">${new Date(s.updated_at).toLocaleDateString(currentLang.replace('_','-'))}</div>
      </div>
      <div class="session-card-actions" onclick="event.stopPropagation()">
        <button class="btn-danger" onclick="deleteSession(${s.id})">${t('journal_delete')}</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('.session-card').forEach(card=>{
    card.addEventListener('click',()=>openSession(+card.dataset.id, sessions.find(s=>s.id===+card.dataset.id).topic));
  });
}
document.getElementById('new-session-btn').addEventListener('click', async () => {
  const topic=document.getElementById('new-topic-input').value.trim(); if (!topic) return;
  try {
    const r=await apiFetch('/sessions/',{method:'POST',body:JSON.stringify({topic})});
    const s=await r.json(); document.getElementById('new-topic-input').value=''; openSession(s.id,s.topic);
  } catch {alert(t('error_network'));}
});
document.getElementById('new-topic-input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('new-session-btn').click();});
async function deleteSession(id) {
  if (!confirm('Delete this session?')) return;
  await apiFetch(`/sessions/${id}`,{method:'DELETE'}); loadSessions();
}

// CHAT
async function openSession(id, topic) {
  currentSessionId=id;
  document.getElementById('chat-topic-title').textContent=topic;
  document.getElementById('chat-messages').innerHTML='';
  showView('chat');
  try { const r=await apiFetch(`/sessions/${id}`); const d=await r.json(); d.messages.forEach(m=>appendBubble(m.role,m.content)); } catch {}
}
document.getElementById('back-btn').addEventListener('click',()=>{loadSessions();showView('journal');});
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
document.getElementById('chat-input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';});

async function sendChat() {
  const content=document.getElementById('chat-input').value.trim();
  if (!content||!currentSessionId) return;
  document.getElementById('chat-input').value=''; document.getElementById('chat-input').style.height='auto';
  document.getElementById('chat-send').disabled=true;
  appendBubble('user',content); const typing=appendTyping();
  try {
    const r=await apiFetch(`/chat/${currentSessionId}`,{method:'POST',body:JSON.stringify({content})});
    const msg=await r.json(); typing.remove(); appendBubble('assistant',msg.content);
  } catch {typing.remove();appendBubble('assistant',t('error_network'));}
  finally {document.getElementById('chat-send').disabled=false;}
}
function appendBubble(role,content) {
  const msgs=document.getElementById('chat-messages');
  const w=document.createElement('div'); w.className=`message ${role}`;
  w.innerHTML=`<div class="msg-label">${role==='user'?t('journal_you'):t('journal_assistant')}</div><div class="bubble">${esc(content)}</div>`;
  msgs.appendChild(w); msgs.scrollTop=msgs.scrollHeight; return w;
}
function appendTyping() {
  const msgs=document.getElementById('chat-messages');
  const w=document.createElement('div'); w.className='message assistant typing';
  w.innerHTML=`<div class="msg-label">${t('journal_assistant')}</div><div class="bubble"><span></span><span></span><span></span></div>`;
  msgs.appendChild(w); msgs.scrollTop=msgs.scrollHeight; return w;
}

// CONTACT
document.getElementById('contact-send-btn').addEventListener('click', async () => {
  clearErrors('contact-success','contact-error','err-contact-name','err-contact-email','err-contact-message');
  const name=document.getElementById('contact-name').value.trim();
  const email=document.getElementById('contact-email').value.trim();
  const message=document.getElementById('contact-message').value.trim();
  let ok=true;
  if (!name){showFieldError('err-contact-name',t('contact_error_name'));ok=false;}
  if (!email||!/\S+@\S+\.\S+/.test(email)){showFieldError('err-contact-email',t('contact_error_email'));ok=false;}
  if (message.length<10){showFieldError('err-contact-message',t('contact_error_message'));ok=false;}
  if (!ok) return;
  const btn=document.getElementById('contact-send-btn'); btn.disabled=true;
  try {
    const r=await apiFetch('/contact/',{method:'POST',body:JSON.stringify({name,email,message})});
    if (!r.ok){const d=await r.json();showErr('contact-error',d.detail||t('error_network'));return;}
    document.getElementById('contact-name').value='';
    document.getElementById('contact-email').value='';
    document.getElementById('contact-message').value='';
    const s=document.getElementById('contact-success'); s.textContent=t('contact_success'); s.classList.add('visible');
  } catch {showErr('contact-error',t('error_network'));} finally {btn.disabled=false;}
});

// UTILS
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// INIT
async function init() {
  document.getElementById('lang-select').value=currentLang;
  await loadTranslations(currentLang);
  updateNav();
  if (token&&currentUser){await loadSessions();showView('journal');applyTranslations();}
}
init();
</script>
</body>
</html>
